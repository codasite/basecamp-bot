[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basecamp-bot"
version = "0.2.0"
description = "Read Basecamp as a user, draft replies with an LLM or your own agent, post only after a human approves in Basecamp."
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic"]
openai = ["openai"]   # also used for OpenRouter and Hermes
all = ["anthropic", "openai"]

[project.scripts]
bcbot = "bcbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
